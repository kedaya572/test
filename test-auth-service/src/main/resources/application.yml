server:
  port: 8081

spring:
  application:
    name: test-auth-service
  datasource:
    url: jdbc:mysql://localhost:3306/student_db?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
        namespace: public

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.xxx.auth.entity
  global-config:
    db-config:
      # 逻辑删除字段名
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      id-type: auto
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

jwt:
  secret: mySecretKeyForStudentManagementSystem2024
  expiration: 86400000

logging:
  level:
    com.xxx.auth: debug
